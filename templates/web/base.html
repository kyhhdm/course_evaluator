<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Course Evaluator{% endblock %}</title>
<style>
body { font-family: Arial, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #111; }
a { color: #06c; }
.flash { background: #fffae6; border: 1px solid #e0c000; padding: .5rem; margin: .5rem 0; }
.btn { display: inline-block; padding: .4rem .8rem; background: #06c; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
.progress { background: #eee; height: 8px; border-radius: 4px; margin: .5rem 0; }
.progress > div { background: #06c; height: 8px; border-radius: 4px; }
ul.options { list-style: none; padding: 0; }
ul.options li { margin: .3rem 0; }
</style>
</head>
<body>
{% with messages = get_flashed_messages() %}
{% if messages %}{% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}{% endif %}
{% endwith %}
{% block body %}{% endblock %}
</body>
</html>
