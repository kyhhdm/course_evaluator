items:
  # --- a1-num-realnum (L2-3) ---
  - id: A1NUMRE-D1
    role: diagnostic
    points: [a1-num-realnum]
    difficulty: 1
    type: numeric
    prompt: "Evaluate |{-8}|."
    answer: "8"
    lesson_refs: [3]
  - id: A1NUMRE-D2
    role: diagnostic
    points: [a1-num-realnum]
    difficulty: 2
    type: mcq
    prompt: "Which list is ordered from least to greatest?"
    options: {A: "-3, -1, 0, 2", B: "0, -1, -3, 2", C: "2, 0, -1, -3", D: "-1, -3, 0, 2"}
    answer: "A"
    lesson_refs: [2]
  - id: A1NUMRE-P1
    role: practice
    points: [a1-num-realnum]
    difficulty: 2
    type: numeric
    prompt: "Evaluate 3 + 2 * 4^2 - 5."
    answer: "30"
    lesson_refs: [3]
  - id: A1NUMRE-P2
    role: practice
    points: [a1-num-realnum]
    difficulty: 1
    type: mcq
    prompt: "Which number is irrational?"
    options: {A: "sqrt(2)", B: "1/3", C: "-4", D: "0.25"}
    answer: "A"
    lesson_refs: [2]
  # --- a1-num-exprad (L3, 30-33, 58) ---
  - id: A1NUMEX-D1
    role: diagnostic
    points: [a1-num-exprad]
    difficulty: 1
    type: mcq
    prompt: "Simplify x^3 * x^4."
    options: {A: "x^7", B: "x^12", C: "2x^7", D: "x^(-1)"}
    answer: "A"
    lesson_refs: [30]
  - id: A1NUMEX-D2
    role: diagnostic
    points: [a1-num-exprad]
    difficulty: 2
    type: mcq
    prompt: "Which expression equals 0.00345 written in scientific notation?"
    options: {A: "3.45 x 10^(-3)", B: "3.45 x 10^(-4)", C: "3.45 x 10^3", D: "3.45 x 10^(-2)"}
    answer: "A"
    lesson_refs: [33]
  - id: A1NUMEX-P1
    role: practice
    points: [a1-num-exprad]
    difficulty: 2
    type: numeric
    prompt: "Simplify sqrt(36). Enter the integer result."
    answer: "6"
    lesson_refs: [31]
  - id: A1NUMEX-P2
    role: practice
    points: [a1-num-exprad]
    difficulty: 3
    type: mcq
    prompt: "Which expression is the simplified form of sqrt(48)?"
    options: {A: "4*sqrt(3)", B: "6*sqrt(2)", C: "2*sqrt(6)", D: "3*sqrt(4)"}
    answer: "A"
    lesson_refs: [31]
  # --- a1-num-units (L5-6, 44-45) ---
  - id: A1NUMUN-D1
    role: diagnostic
    points: [a1-num-units]
    difficulty: 1
    type: numeric
    prompt: "What is 25% of 80?"
    answer: "20"
    lesson_refs: [5]
  - id: A1NUMUN-D2
    role: diagnostic
    points: [a1-num-units]
    difficulty: 2
    type: mcq
    prompt: "Use a unit multiplier to convert 3.5 km to meters. Which answer is correct?"
    options: {A: "3500", B: "350", C: "35000", D: "0.35"}
    answer: "A"
    lesson_refs: [44]
  - id: A1NUMUN-P1
    role: practice
    points: [a1-num-units]
    difficulty: 2
    type: numeric
    prompt: "A car travels 150 miles in 3 hours. What is its average speed in miles per hour?"
    answer: "50"
    lesson_refs: [6]
  - id: A1NUMUN-P2
    role: practice
    points: [a1-num-units]
    difficulty: 3
    type: mcq
    prompt: "Use unit multipliers to convert 2 feet to centimeters (1 ft = 12 in, 1 in = 2.54 cm). Which answer is correct?"
    options: {A: "60.96", B: "50.80", C: "24", D: "76.2"}
    answer: "A"
    lesson_refs: [44]
  # --- a1-expr-interpret (L8, 35, 36, 37, 38) ---
  - id: A1EXPRI-D1
    role: diagnostic
    points: [a1-expr-interpret]
    difficulty: 1
    type: numeric
    prompt: "In the expression 5x, what is the coefficient of x?"
    answer: "5"
    lesson_refs: [8]
  - id: A1EXPRI-D2
    role: diagnostic
    points: [a1-expr-interpret]
    difficulty: 2
    type: mcq
    prompt: "Which expression is the expanded form of 3(2x - 4)?"
    options: {A: "6x - 12", B: "6x - 4", C: "2x - 12", D: "6x + 12"}
    answer: "A"
    lesson_refs: [8]
  - id: A1EXPRI-P1
    role: practice
    points: [a1-expr-interpret]
    difficulty: 2
    type: numeric
    prompt: "Simplify 4x + 3 + 2x - 7, then evaluate at x = 2."
    answer: "8"
    lesson_refs: [35]
  - id: A1EXPRI-P2
    role: practice
    points: [a1-expr-interpret]
    difficulty: 3
    type: mcq
    prompt: "Which expression is the fully simplified form of 2(x + 3) + 4x - 1?"
    options: {A: "6x + 5", B: "6x + 7", C: "4x + 5", D: "6x - 1"}
    answer: "A"
    lesson_refs: [37]
  # --- a1-expr-model (L7, 8, 48) ---
  - id: A1EXPRM-D1
    role: diagnostic
    points: [a1-expr-model]
    difficulty: 1
    type: numeric
    prompt: "The product of 5 and a number is 35. Find the number."
    answer: "7"
    lesson_refs: [7]
  - id: A1EXPRM-D2
    role: diagnostic
    points: [a1-expr-model]
    difficulty: 2
    type: mcq
    prompt: "Which equation models the statement '8 less than twice a number is 14'?"
    options: {A: "2N - 8 = 14", B: "8 - 2N = 14", C: "2N + 8 = 14", D: "2(N - 8) = 14"}
    answer: "A"
    lesson_refs: [8]
  - id: A1EXPRM-P1
    role: practice
    points: [a1-expr-model]
    difficulty: 2
    type: numeric
    prompt: "A farmer earns $4 per basket of berries plus a $10 base pay. If she earned $50 total, how many baskets did she pick?"
    answer: "10"
    lesson_refs: [8]
  - id: A1EXPRM-P2
    role: practice
    points: [a1-expr-model]
    difficulty: 3
    type: mcq
    prompt: "Which equation models 'three times the sum of a number and 5 equals 24'?"
    options: {A: "3(N + 5) = 24", B: "3N + 5 = 24", C: "3N - 5 = 24", D: "3(N - 5) = 24"}
    answer: "A"
    lesson_refs: [8]
  # --- a1-expr-linear (L7, 46) ---
  - id: A1EXPRL-D1
    role: diagnostic
    points: [a1-expr-linear]
    difficulty: 1
    type: numeric
    prompt: "Solve for x: 3x + 7 = 22."
    answer: "5"
    lesson_refs: [7]
  - id: A1EXPRL-D2
    role: diagnostic
    points: [a1-expr-linear]
    difficulty: 2
    type: mcq
    prompt: "Solve for x: 2x - 5 = 3x + 1. Which value is correct?"
    options: {A: "-6", B: "6", C: "-4", D: "4"}
    answer: "A"
    lesson_refs: [46]
  - id: A1EXPRL-P1
    role: practice
    points: [a1-expr-linear]
    difficulty: 2
    type: numeric
    prompt: "Solve for x: 4(x - 2) = 2x + 6."
    answer: "7"
    lesson_refs: [46]
  - id: A1EXPRL-P2
    role: practice
    points: [a1-expr-linear]
    difficulty: 3
    type: mcq
    prompt: "Solve for x: 3(2x + 1) - x = 2(x + 6). Which value is correct?"
    options: {A: "3", B: "9", C: "1", D: "-3"}
    answer: "A"
    lesson_refs: [46]
  # --- a1-poly-ops (L37, L38) ---
  - id: A1POLYO-D1
    role: diagnostic
    points: [a1-poly-ops]
    difficulty: 1
    type: numeric
    prompt: "Add the polynomials: (2x + 3) + (5x - 1). What is the coefficient of x in the result?"
    answer: "7"
    lesson_refs: [37]
  - id: A1POLYO-D2
    role: diagnostic
    points: [a1-poly-ops]
    difficulty: 2
    type: mcq
    prompt: "Which expression equals (x + 2)(x + 3)?"
    options: {A: "x^2 + 5x + 6", B: "x^2 + 6x + 5", C: "x^2 + 5x + 5", D: "x^2 + 6x + 6"}
    answer: "A"
    lesson_refs: [37]
  - id: A1POLYO-P1
    role: practice
    points: [a1-poly-ops]
    difficulty: 2
    type: numeric
    prompt: "Subtract the polynomials: (4x^2 - 3x + 7) - (x^2 + 2x - 1). What is the constant term of the result?"
    answer: "8"
    lesson_refs: [38]
  - id: A1POLYO-P2
    role: practice
    points: [a1-poly-ops]
    difficulty: 3
    type: mcq
    prompt: "Which expression equals (2x - 1)(x + 4)?"
    options: {A: "2x^2 + 7x - 4", B: "2x^2 - 7x - 4", C: "2x^2 + 7x + 4", D: "2x^2 + 8x - 4"}
    answer: "A"
    lesson_refs: [37]
  # --- a1-poly-factor (L51, L75, L91) ---
  - id: A1POLYF-D1
    role: diagnostic
    points: [a1-poly-factor]
    difficulty: 1
    type: mcq
    prompt: "Which pair of binomials is the factored form of x^2 + 5x + 6?"
    options: {A: "(x + 2)(x + 3)", B: "(x + 1)(x + 6)", C: "(x + 2)(x + 4)", D: "(x - 2)(x - 3)"}
    answer: "A"
    lesson_refs: [51]
  - id: A1POLYF-D2
    role: diagnostic
    points: [a1-poly-factor]
    difficulty: 2
    type: numeric
    prompt: "Factor x^2 - 7x + 12 = 0 and find the larger root."
    answer: "4"
    lesson_refs: [75]
  - id: A1POLYF-P1
    role: practice
    points: [a1-poly-factor]
    difficulty: 2
    type: mcq
    prompt: "Which is the factored form of x^2 - x - 6?"
    options: {A: "(x - 3)(x + 2)", B: "(x + 3)(x - 2)", C: "(x - 6)(x + 1)", D: "(x + 6)(x - 1)"}
    answer: "A"
    lesson_refs: [51]
  - id: A1POLYF-P2
    role: practice
    points: [a1-poly-factor]
    difficulty: 3
    type: numeric
    prompt: "Factor x^2 + x - 12 = 0 and find the positive root."
    answer: "3"
    lesson_refs: [75]
  # --- a1-quad-solve (L75, L76, L91, L92) ---
  - id: A1QUAD-D1
    role: diagnostic
    points: [a1-quad-solve]
    difficulty: 1
    type: numeric
    prompt: "Solve by factoring: x^2 - 5x + 6 = 0. What is the larger root?"
    answer: "3"
    lesson_refs: [75]
  - id: A1QUAD-D2
    role: diagnostic
    points: [a1-quad-solve]
    difficulty: 2
    type: numeric
    prompt: "Solve by factoring: x^2 - 6x + 9 = 0. The equation has a repeated root. What is that root?"
    answer: "3"
    lesson_refs: [76]
  - id: A1QUAD-P1
    role: practice
    points: [a1-quad-solve]
    difficulty: 2
    type: mcq
    prompt: "Use the quadratic formula to solve x^2 - 7x + 10 = 0. What is the larger root?"
    options: {A: "5", B: "2", C: "7", D: "10"}
    answer: "A"
    lesson_refs: [92]
  - id: A1QUAD-P2
    role: practice
    points: [a1-quad-solve]
    difficulty: 3
    type: mcq
    prompt: "Use completing the square to solve x^2 + 4x - 5 = 0. Which lists both roots correctly?"
    options: {A: "x = 1 and x = -5", B: "x = 5 and x = -1", C: "x = -1 and x = -5", D: "x = 1 and x = 5"}
    answer: "A"
    lesson_refs: [91]
  # --- a1-complex (L92, L95) ---
  - id: A1CPLX-D1
    role: diagnostic
    points: [a1-complex]
    difficulty: 1
    type: mcq
    prompt: "What is the value of i^2?"
    options: {A: "-1", B: "1", C: "i", D: "-i"}
    answer: "A"
    lesson_refs: [92]
  - id: A1CPLX-D2
    role: diagnostic
    points: [a1-complex]
    difficulty: 2
    type: mcq
    prompt: "Solve x^2 + 1 = 0. Which lists the two roots correctly?"
    options: {A: "i and -i", B: "1 and -1", C: "sqrt(1) and -sqrt(1)", D: "i and i"}
    answer: "A"
    lesson_refs: [92]
  - id: A1CPLX-P1
    role: practice
    points: [a1-complex]
    difficulty: 2
    type: mcq
    prompt: "Use the quadratic formula to solve x^2 + 4 = 0. Which lists both complex roots?"
    options: {A: "2i and -2i", B: "4i and -4i", C: "2 and -2", D: "sqrt(4) and -sqrt(4)"}
    answer: "A"
    lesson_refs: [92]
  - id: A1CPLX-P2
    role: practice
    points: [a1-complex]
    difficulty: 3
    type: mcq
    prompt: "Use the quadratic formula to find the complex roots of x^2 - 2x + 5 = 0. Which answer is correct?"
    options: {A: "1 + 2i and 1 - 2i", B: "2 + i and 2 - i", C: "-1 + 2i and -1 - 2i", D: "1 + 4i and 1 - 4i"}
    answer: "A"
    lesson_refs: [95]
  # --- a1-func-concept (L15, L52, L53) ---
  - id: A1FUNC-D1
    role: diagnostic
    points: [a1-func-concept]
    difficulty: 1
    type: mcq
    prompt: "If f(x) = 2x + 1, what is f(5)?"
    options: {A: "11", B: "9", C: "13", D: "7"}
    answer: "A"
    lesson_refs: [15]
  - id: A1FUNC-D2
    role: diagnostic
    points: [a1-func-concept]
    difficulty: 2
    type: mcq
    prompt: "What is the domain of f(x) = sqrt(x - 3)?"
    options: {A: "x >= 3", B: "x >= 0", C: "x > 3", D: "all real numbers"}
    answer: "A"
    lesson_refs: [15]
  - id: A1FUNC-P1
    role: practice
    points: [a1-func-concept]
    difficulty: 2
    type: mcq
    prompt: "If g(x) = x^2 - 3x + 2, what is g(-1)?"
    options: {A: "6", B: "0", C: "4", D: "-2"}
    answer: "A"
    lesson_refs: [15]
  - id: A1FUNC-P2
    role: practice
    points: [a1-func-concept]
    difficulty: 2
    type: mcq
    prompt: "Which describes the range of f(x) = x^2?"
    options: {A: "y >= 0", B: "all real numbers", C: "y > 0", D: "y <= 0"}
    answer: "A"
    lesson_refs: [52]
  # --- a1-func-graph (L16, L55, L56, L57) ---
  - id: A1FGRA-D1
    role: diagnostic
    points: [a1-func-graph]
    difficulty: 1
    type: mcq
    prompt: "For the line y = 4x - 3, what is the slope?"
    options: {A: "4", B: "-3", C: "3", D: "-4"}
    answer: "A"
    lesson_refs: [16]
  - id: A1FGRA-D2
    role: diagnostic
    points: [a1-func-graph]
    difficulty: 2
    type: mcq
    prompt: "The graph of f(x) = x^2 is shifted up 3 units. Which equation represents the new graph?"
    options: {A: "g(x) = x^2 + 3", B: "g(x) = x^2 - 3", C: "g(x) = (x + 3)^2", D: "g(x) = (x - 3)^2"}
    answer: "A"
    lesson_refs: [57]
  - id: A1FGRA-P1
    role: practice
    points: [a1-func-graph]
    difficulty: 2
    type: mcq
    prompt: "What is the x-intercept of the line y = 3x - 6?"
    options: {A: "2", B: "-2", C: "6", D: "-6"}
    answer: "A"
    lesson_refs: [16]
  - id: A1FGRA-P2
    role: practice
    points: [a1-func-graph]
    difficulty: 3
    type: mcq
    prompt: "The graph of f(x) = |x| is shifted 2 units to the right. Where is the vertex of the new graph?"
    options: {A: "(2, 0)", B: "(-2, 0)", C: "(0, 2)", D: "(0, -2)"}
    answer: "A"
    lesson_refs: [57]
  # --- a1-func-linexp (L48, L81) ---
  - id: A1FLE-D1
    role: diagnostic
    points: [a1-func-linexp]
    difficulty: 2
    type: mcq
    prompt: "Which table shows an exponential pattern (constant ratio) rather than a linear pattern (constant difference)?"
    options: {A: "x: 0,1,2,3  f(x): 1,3,9,27", B: "x: 0,1,2,3  f(x): 2,5,8,11", C: "x: 0,1,2,3  f(x): 4,7,10,13", D: "x: 0,1,2,3  f(x): 0,4,8,12"}
    answer: "A"
    lesson_refs: [81]
  - id: A1FLE-D2
    role: diagnostic
    points: [a1-func-linexp]
    difficulty: 2
    type: mcq
    prompt: "A line passes through (0, 1) and (2, 7). Which equation fits this line?"
    options: {A: "y = 3x + 1", B: "y = 2x + 1", C: "y = 3x - 1", D: "y = 6x + 1"}
    answer: "A"
    lesson_refs: [48]
  - id: A1FLE-P1
    role: practice
    points: [a1-func-linexp]
    difficulty: 2
    type: mcq
    prompt: "A population doubles every year starting at 50. Which type of function best models this situation?"
    options: {A: "Exponential", B: "Linear", C: "Quadratic", D: "Square root"}
    answer: "A"
    lesson_refs: [48]
  - id: A1FLE-P2
    role: practice
    points: [a1-func-linexp]
    difficulty: 3
    type: mcq
    prompt: "A line passes through (1, 5) and (3, 11). Which equation represents this line?"
    options: {A: "y = 3x + 2", B: "y = 2x + 3", C: "y = 3x - 2", D: "y = 6x - 1"}
    answer: "A"
    lesson_refs: [48]
  # --- a1-geo-def (L9, L10, L11) ---
  - id: A1GDEF-D1
    role: diagnostic
    points: [a1-geo-def]
    difficulty: 1
    type: mcq
    prompt: "Which of the following best defines an angle in geometry?"
    options: {A: "Two rays in the same plane sharing a common endpoint and not overlapping", B: "Two parallel lines in the same plane", C: "A flat surface having length and width only", D: "A line segment with two endpoints"}
    answer: "A"
    lesson_refs: [9]
  - id: A1GDEF-D2
    role: diagnostic
    points: [a1-geo-def]
    difficulty: 2
    type: mcq
    prompt: "Two lines are perpendicular to each other. Which statement must be true?"
    options: {A: "They intersect forming four right angles", B: "They never intersect", C: "They form two obtuse angles", D: "They share more than one point"}
    answer: "A"
    lesson_refs: [9]
  - id: A1GDEF-P1
    role: practice
    points: [a1-geo-def]
    difficulty: 1
    type: mcq
    prompt: "Which of the following best defines parallel lines?"
    options: {A: "Two lines in the same plane that never intersect", B: "Two lines that meet at a right angle", C: "Two rays sharing a common endpoint", D: "Two lines that intersect at exactly one point"}
    answer: "A"
    lesson_refs: [9]
  - id: A1GDEF-P2
    role: practice
    points: [a1-geo-def]
    difficulty: 2
    type: mcq
    prompt: "A right angle is formed when two lines intersect. How many right angles are formed at that intersection?"
    options: {A: "4", B: "1", C: "2", D: "3"}
    answer: "A"
    lesson_refs: [9]
  # --- a1-geo-proof (L10, L66, L67, L68) ---
  - id: A1GPRF-D1
    role: diagnostic
    points: [a1-geo-proof]
    difficulty: 1
    type: numeric
    prompt: "Two angles of a triangle measure 47° and 83°. What is the measure of the third angle in degrees?"
    answer: "50"
    lesson_refs: [68]
  - id: A1GPRF-D2
    role: diagnostic
    points: [a1-geo-proof]
    difficulty: 2
    type: mcq
    prompt: "In an isosceles triangle, one of the base angles measures 35°. What is the measure of the angle at the apex (vertex angle)?"
    options: {A: "110", B: "35", C: "70", D: "145"}
    answer: "A"
    lesson_refs: [68]
  - id: A1GPRF-P1
    role: practice
    points: [a1-geo-proof]
    difficulty: 2
    type: numeric
    prompt: "In a triangle, one angle is twice the smallest angle, and the third angle is 60°. What is the measure of the smallest angle in degrees?"
    answer: "40"
    lesson_refs: [66]
  - id: A1GPRF-P2
    role: practice
    points: [a1-geo-proof]
    difficulty: 3
    type: mcq
    prompt: "Which congruency theorem applies when two sides and the included angle of one triangle are equal to two sides and the included angle of another triangle?"
    options: {A: "SAS", B: "SSS", C: "HL", D: "AAAS"}
    answer: "A"
    lesson_refs: [68]
  # --- a1-geo-circle (L40, L66) ---
  - id: A1GCIR-D1
    role: diagnostic
    points: [a1-geo-circle]
    difficulty: 1
    type: numeric
    prompt: "A central angle of a circle measures 80°. An inscribed angle intercepts the same arc. What is the measure of the inscribed angle in degrees?"
    answer: "40"
    lesson_refs: [40]
  - id: A1GCIR-D2
    role: diagnostic
    points: [a1-geo-circle]
    difficulty: 2
    type: mcq
    prompt: "An inscribed angle in a circle intercepts an arc of 110°. What is the measure of the inscribed angle?"
    options: {A: "55", B: "110", C: "220", D: "90"}
    answer: "A"
    lesson_refs: [40]
  - id: A1GCIR-P1
    role: practice
    points: [a1-geo-circle]
    difficulty: 2
    type: mcq
    prompt: "Which statement correctly describes the inscribed angle theorem?"
    options: {A: "An inscribed angle equals half the measure of the arc it intercepts", B: "An inscribed angle equals the measure of the arc it intercepts", C: "An inscribed angle equals twice the measure of the arc it intercepts", D: "An inscribed angle equals the central angle minus 90°"}
    answer: "A"
    lesson_refs: [40]
  - id: A1GCIR-P2
    role: practice
    points: [a1-geo-circle]
    difficulty: 3
    type: numeric
    prompt: "Two chords intersect inside a circle. One chord is divided into segments of length 3 and 6. The other chord is divided into segments of length 2 and x. Find x."
    answer: "9"
    lesson_refs: [66]
