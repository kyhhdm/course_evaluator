items:
  # --- g5-equiv-fractions ---
  - id: EQF-1
    role: diagnostic
    points: [g5-equiv-fractions]
    difficulty: 1
    type: mcq
    prompt: "Which fraction is equal to 1/2?"
    options: {A: "2/3", B: "3/6", C: "1/3", D: "2/5"}
    answer: "B"
    distractor_feedback: {A: "Numerator and denominator must scale by the same factor."}
  - id: EQF-2
    role: diagnostic
    points: [g5-equiv-fractions]
    difficulty: 2
    type: mcq
    prompt: "Which fraction is NOT equal to 3/4?"
    options: {A: "6/8", B: "9/12", C: "12/16", D: "4/5"}
    answer: "D"
  - id: EQF-3
    role: diagnostic
    points: [g5-equiv-fractions]
    difficulty: 3
    type: numeric
    prompt: "Fill in the blank: 2/5 = ?/20"
    answer: "8"
  # --- g5-equiv-fractions (practice) ---
  - id: EQF-P1
    points: [g5-equiv-fractions]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "Which fraction is equal to 2/3?"
    options: {A: "4/6", B: "2/6", C: "3/4", D: "4/9"}
    answer: "A"
  - id: EQF-P2
    points: [g5-equiv-fractions]
    difficulty: 2
    type: numeric
    role: practice
    prompt: "Fill in the blank: 5/6 = ?/18  (enter the numerator)"
    answer: "15"
  # --- g5-add-like ---
  - id: ALK-1
    role: diagnostic
    points: [g5-add-like]
    difficulty: 1
    type: numeric
    prompt: "1/5 + 2/5 = ?/5  (enter the numerator)"
    answer: "3"
  - id: ALK-2
    role: diagnostic
    points: [g5-add-like]
    difficulty: 2
    type: mcq
    prompt: "7/8 - 3/8 = ?"
    options: {A: "4/8", B: "4/0", C: "10/8", D: "4/16"}
    answer: "A"
  - id: ALK-3
    role: diagnostic
    points: [g5-add-like]
    difficulty: 3
    type: numeric
    prompt: "5/6 - 1/6 - 1/6 = ?/6  (enter the numerator)"
    answer: "3"
  # --- g5-add-like (practice) ---
  - id: ALK-P1
    points: [g5-add-like]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "2/9 + 4/9 = ?/9  (enter the numerator)"
    answer: "6"
  - id: ALK-P2
    points: [g5-add-like]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "5/6 - 2/6 = ?"
    options: {A: "3/6", B: "7/6", C: "3/12", D: "1/3"}
    answer: "A"
  # --- g5-add-unlike ---
  - id: ALU-1
    role: diagnostic
    points: [g5-add-unlike]
    difficulty: 1
    type: mcq
    prompt: "1/2 + 1/4 = ?"
    options: {A: "2/6", B: "3/4", C: "1/6", D: "2/4"}
    answer: "B"
  - id: ALU-2
    role: diagnostic
    points: [g5-add-unlike]
    difficulty: 2
    type: mcq
    prompt: "2/3 - 1/6 = ?"
    options: {A: "1/3", B: "1/2", C: "5/6", D: "1/6"}
    answer: "B"
  - id: ALU-3
    role: diagnostic
    points: [g5-add-unlike]
    difficulty: 3
    type: numeric
    prompt: "3/4 + 1/6 = ?/12  (enter the numerator)"
    answer: "11"
  # --- g5-add-unlike (practice) ---
  - id: ALU-P1
    points: [g5-add-unlike]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "1/3 + 1/4 = ?"
    options: {A: "7/12", B: "2/7", C: "5/12", D: "1/2"}
    answer: "A"
  - id: ALU-P2
    points: [g5-add-unlike]
    difficulty: 2
    type: numeric
    role: practice
    prompt: "3/4 - 1/3 = ?/12  (enter the numerator)"
    answer: "5"
  # --- g5-mult-fraction-whole ---
  - id: MFW-1
    role: diagnostic
    points: [g5-mult-fraction-whole]
    difficulty: 1
    type: numeric
    prompt: "3 x 1/4 = ?/4  (enter the numerator)"
    answer: "3"
  - id: MFW-2
    role: diagnostic
    points: [g5-mult-fraction-whole]
    difficulty: 2
    type: mcq
    prompt: "4 x 2/5 = ?"
    options: {A: "8/5", B: "6/5", C: "8/20", D: "2/20"}
    answer: "A"
  - id: MFW-3
    role: diagnostic
    points: [g5-mult-fraction-whole]
    difficulty: 3
    type: mcq
    prompt: "A recipe needs 2/3 cup of flour. How much for 3 batches?"
    options: {A: "2 cups", B: "6/3 cup but not 2", C: "2/9 cup", D: "5/3 cup"}
    answer: "A"
  # --- g5-mult-fraction-whole (practice) ---
  - id: MFW-P1
    points: [g5-mult-fraction-whole]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "4 x 1/3 = ?/3  (enter the numerator)"
    answer: "4"
  - id: MFW-P2
    points: [g5-mult-fraction-whole]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "6 x 3/4 = ?"
    options: {A: "18/4", B: "9/4", C: "3/2", D: "12/4"}
    answer: "A"
  # --- g5-mult-fraction-fraction ---
  - id: MFF-1
    role: diagnostic
    points: [g5-mult-fraction-fraction]
    difficulty: 1
    type: mcq
    prompt: "1/2 x 1/3 = ?"
    options: {A: "1/6", B: "2/3", C: "1/5", D: "2/6"}
    answer: "A"
  - id: MFF-2
    role: diagnostic
    points: [g5-mult-fraction-fraction]
    difficulty: 2
    type: numeric
    prompt: "2/3 x 3/4 = ?/12  (enter the numerator)"
    answer: "6"
  - id: MFF-3
    role: diagnostic
    points: [g5-mult-fraction-fraction]
    difficulty: 3
    type: mcq
    prompt: "What is 3/5 of 2/3?"
    options: {A: "6/15", B: "5/8", C: "6/8", D: "3/5"}
    answer: "A"
  # --- g5-mult-fraction-fraction (practice) ---
  - id: MFF-P1
    points: [g5-mult-fraction-fraction]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "1/3 x 1/4 = ?"
    options: {A: "1/12", B: "1/7", C: "4/3", D: "2/12"}
    answer: "A"
  - id: MFF-P2
    points: [g5-mult-fraction-fraction]
    difficulty: 3
    type: numeric
    role: practice
    prompt: "3/4 x 2/5 = ?/20  (enter the numerator)"
    answer: "6"
  # --- g5-divide-unit-fraction ---
  - id: DUF-1
    role: diagnostic
    points: [g5-divide-unit-fraction]
    difficulty: 1
    type: mcq
    prompt: "1/3 divided by 2 = ?"
    options: {A: "1/6", B: "2/3", C: "1/5", D: "3/2"}
    answer: "A"
  - id: DUF-2
    role: diagnostic
    points: [g5-divide-unit-fraction]
    difficulty: 2
    type: numeric
    prompt: "6 divided by 1/2 = ?"
    answer: "12"
  - id: DUF-3
    role: diagnostic
    points: [g5-divide-unit-fraction]
    difficulty: 3
    type: mcq
    prompt: "How many 1/4-cup scoops are in 3 cups?"
    options: {A: "12", B: "7", C: "3/4", D: "4"}
    answer: "A"
  # --- g5-divide-unit-fraction (practice) ---
  - id: DUF-P1
    points: [g5-divide-unit-fraction]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "1/4 divided by 3 = ?"
    options: {A: "1/12", B: "3/4", C: "1/7", D: "4/3"}
    answer: "A"
  - id: DUF-P2
    points: [g5-divide-unit-fraction]
    difficulty: 2
    type: numeric
    role: practice
    prompt: "4 divided by 1/3 = ?"
    answer: "12"
  # --- g5-decimal-place-value ---
  - id: DPV-1
    role: diagnostic
    points: [g5-decimal-place-value]
    difficulty: 1
    type: mcq
    prompt: "What is the value of the 7 in 0.275?"
    options: {A: "7 tenths", B: "7 hundredths", C: "7 thousandths", D: "7 ones"}
    answer: "B"
  - id: DPV-2
    role: diagnostic
    points: [g5-decimal-place-value]
    difficulty: 2
    type: mcq
    prompt: "Which is larger: 0.4 or 0.38?"
    options: {A: "0.4", B: "0.38", C: "they are equal", D: "cannot tell"}
    answer: "A"
  - id: DPV-3
    role: diagnostic
    points: [g5-decimal-place-value]
    difficulty: 3
    type: numeric
    prompt: "Write 'three hundred twelve thousandths' as a decimal."
    answer: "0.312"
  # --- g5-decimal-place-value (practice) ---
  - id: DPV-P1
    points: [g5-decimal-place-value]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "What is the value of the 5 in 0.356?"
    options: {A: "5 tenths", B: "5 hundredths", C: "5 thousandths", D: "5 ones"}
    answer: "B"
  - id: DPV-P2
    points: [g5-decimal-place-value]
    difficulty: 2
    type: numeric
    role: practice
    prompt: "Write 'forty-two hundredths' as a decimal."
    answer: "0.42"
  # --- g5-add-subtract-decimals ---
  - id: ASD-1
    role: diagnostic
    points: [g5-add-subtract-decimals]
    difficulty: 1
    type: numeric
    prompt: "0.3 + 0.4 = ?"
    answer: "0.7"
  - id: ASD-2
    role: diagnostic
    points: [g5-add-subtract-decimals]
    difficulty: 2
    type: numeric
    prompt: "1.25 + 0.6 = ?"
    answer: "1.85"
  - id: ASD-3
    role: diagnostic
    points: [g5-add-subtract-decimals]
    difficulty: 3
    type: numeric
    prompt: "5 - 2.35 = ?"
    answer: "2.65"
  # --- g5-add-subtract-decimals (practice) ---
  - id: ASD-P1
    points: [g5-add-subtract-decimals]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "0.6 + 0.2 = ?"
    answer: "0.8"
  - id: ASD-P2
    points: [g5-add-subtract-decimals]
    difficulty: 2
    type: numeric
    role: practice
    prompt: "3.4 - 1.15 = ?"
    answer: "2.25"
  # --- g5-coordinate-system ---
  - id: G-CS-1
    role: diagnostic
    points: [g5-coordinate-system]
    difficulty: 1
    type: mcq
    prompt: "In the coordinate (x, y), which axis does the first number measure along?"
    options: {A: "the x-axis", B: "the y-axis", C: "neither axis", D: "both axes"}
    answer: "A"
  - id: G-CS-2
    role: diagnostic
    points: [g5-coordinate-system]
    difficulty: 2
    type: mcq
    prompt: "Where do the x-axis and y-axis meet?"
    options: {A: "at the origin (0, 0)", B: "at (1, 1)", C: "at the top", D: "they never meet"}
    answer: "A"
  # --- g5-graph-points ---
  - id: G-GP-1
    role: diagnostic
    points: [g5-graph-points]
    difficulty: 1
    type: numeric
    prompt: "To plot the point (3, 2), you move right 3 from the origin, then up how many?"
    answer: "2"
  - id: G-GP-2
    role: diagnostic
    points: [g5-graph-points]
    difficulty: 2
    type: mcq
    prompt: "A point is 4 right and 0 up from the origin. Its coordinates are?"
    options: {A: "(4, 0)", B: "(0, 4)", C: "(4, 4)", D: "(0, 0)"}
    answer: "A"
  # --- g5-figure-hierarchy ---
  - id: G-FH-1
    role: diagnostic
    points: [g5-figure-hierarchy]
    difficulty: 1
    type: mcq
    prompt: "Every square is also a..."
    options: {A: "rectangle", B: "triangle", C: "circle", D: "pentagon"}
    answer: "A"
  - id: G-FH-2
    role: diagnostic
    points: [g5-figure-hierarchy]
    difficulty: 2
    type: mcq
    prompt: "Which statement is true?"
    options: {A: "All rectangles are squares", B: "All squares are rectangles", C: "No square is a rectangle", D: "All rectangles are triangles"}
    answer: "B"
  # --- g5-classify-figures ---
  - id: G-CF-1
    role: diagnostic
    points: [g5-classify-figures]
    difficulty: 1
    type: mcq
    prompt: "A quadrilateral with exactly one pair of parallel sides is a..."
    options: {A: "trapezoid", B: "square", C: "triangle", D: "pentagon"}
    answer: "A"
  - id: G-CF-2
    role: diagnostic
    points: [g5-classify-figures]
    difficulty: 2
    type: mcq
    prompt: "Which figure is always a parallelogram?"
    options: {A: "rectangle", B: "trapezoid", C: "triangle", D: "pentagon"}
    answer: "A"
  # --- g5-coordinate-system (practice) ---
  - id: G-CS-P1
    points: [g5-coordinate-system]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "In the coordinate (x, y), which number tells how far UP to move?"
    options: {A: "the second number (y)", B: "the first number (x)", C: "neither", D: "both"}
    answer: "A"
  - id: G-CS-P2
    points: [g5-coordinate-system]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "The point (0, 0) is called the..."
    options: {A: "origin", B: "x-axis label", C: "y-axis label", D: "first quadrant"}
    answer: "A"
  # --- g5-graph-points (practice) ---
  - id: G-GP-P1
    points: [g5-graph-points]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "To plot the point (5, 1), you move right 5 from the origin, then up how many?"
    answer: "1"
  - id: G-GP-P2
    points: [g5-graph-points]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "Which point is located 2 units to the right and 6 units up from the origin?"
    options: {A: "(2, 6)", B: "(6, 2)", C: "(2, 2)", D: "(6, 6)"}
    answer: "A"
  # --- g5-figure-hierarchy (practice) ---
  - id: G-FH-P1
    points: [g5-figure-hierarchy]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "Every square is also a rhombus. Why?"
    options: {A: "A square has 4 equal sides, and so does a rhombus", B: "A square has 4 right angles, so it is any quadrilateral", C: "Rhombuses always have 4 right angles", D: "Squares and rhombuses are the same shape"}
    answer: "A"
  - id: G-FH-P2
    points: [g5-figure-hierarchy]
    difficulty: 3
    type: mcq
    role: practice
    prompt: "Which statement about quadrilaterals is TRUE?"
    options: {A: "Every rhombus is a square", B: "Every square is a rhombus", C: "Every rectangle is a square", D: "Every parallelogram is a rectangle"}
    answer: "B"
  # --- g5-classify-figures (practice) ---
  - id: G-CF-P1
    points: [g5-classify-figures]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "A quadrilateral with two pairs of parallel sides is called a..."
    options: {A: "parallelogram", B: "trapezoid", C: "circle", D: "pentagon"}
    answer: "A"
  - id: G-CF-P2
    points: [g5-classify-figures]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "A parallelogram with 4 right angles is always a..."
    options: {A: "rectangle", B: "rhombus", C: "trapezoid", D: "triangle"}
    answer: "A"
  # --- g5-oa-eval-expressions ---
  - id: OA-EV-1
    role: diagnostic
    points: [g5-oa-eval-expressions]
    difficulty: 1
    type: numeric
    prompt: "Evaluate: 2 x (3 + 4)"
    answer: "14"
  - id: OA-EV-2
    role: diagnostic
    points: [g5-oa-eval-expressions]
    difficulty: 2
    type: numeric
    prompt: "Evaluate: 3 + 4 x 2"
    answer: "11"
  - id: OA-EV-3
    role: diagnostic
    points: [g5-oa-eval-expressions]
    difficulty: 3
    type: numeric
    prompt: "Evaluate: (8 - 3) x (2 + 1)"
    answer: "15"
  # --- g5-oa-write-expressions ---
  - id: OA-WR-1
    role: diagnostic
    points: [g5-oa-write-expressions]
    difficulty: 1
    type: mcq
    prompt: "Which expression means 'add 6 and 4, then multiply by 2'?"
    options: {A: "2 x (6 + 4)", B: "2 x 6 + 4", C: "6 + 4 x 2", D: "6 + 4 + 2"}
    answer: "A"
  - id: OA-WR-2
    role: diagnostic
    points: [g5-oa-write-expressions]
    difficulty: 2
    type: mcq
    prompt: "Without computing, 3 x (245 + 18) is ___ (245 + 18)."
    options: {A: "3 times as large as", B: "equal to", C: "smaller than", D: "3 less than"}
    answer: "A"
  # --- g5-oa-patterns-graph ---
  - id: OA-PG-1
    role: diagnostic
    points: [g5-oa-patterns-graph]
    difficulty: 2
    type: numeric
    prompt: "Rule A 'add 2' from 0 gives 0,2,4,6. Rule B 'add 4' from 0 gives 0,4,8,12. The 4th B term divided by the 4th A term is?"
    answer: "2"
  - id: OA-PG-2
    role: diagnostic
    points: [g5-oa-patterns-graph]
    difficulty: 2
    type: mcq
    prompt: "Pattern X adds 3 (0,3,6,9); pattern Y adds 6 (0,6,12,18). Each Y term is the ___ of the matching X term."
    options: {A: "double", B: "half", C: "same", D: "triple"}
    answer: "A"
  # --- g5-oa-eval-expressions (practice) ---
  - id: OA-EV-P1
    points: [g5-oa-eval-expressions]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "Evaluate: 4 x (1 + 5)"
    answer: "24"
  - id: OA-EV-P2
    points: [g5-oa-eval-expressions]
    difficulty: 2
    type: numeric
    role: practice
    prompt: "Evaluate: 12 - 4 / 2"
    answer: "10"
  # --- g5-oa-write-expressions (practice) ---
  - id: OA-WR-P1
    points: [g5-oa-write-expressions]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "Which expression means 'subtract 3 from 10, then double the result'?"
    options: {A: "2 x 10 - 3", B: "2 x (10 - 3)", C: "10 - 3 x 2", D: "10 - 3 + 2"}
    answer: "B"
  - id: OA-WR-P2
    points: [g5-oa-write-expressions]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "Which expression means '5 more than the product of 3 and 4'?"
    options: {A: "(5 + 3) x 4", B: "5 x (3 + 4)", C: "3 x 4 + 5", D: "3 + 4 x 5"}
    answer: "C"
  # --- g5-oa-patterns-graph (practice) ---
  - id: OA-PG-P1
    points: [g5-oa-patterns-graph]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "Starting at 0, applying the rule 'add 3' gives the sequence 0, 3, 6, 9, … What is the 5th term?"
    answer: "12"
  - id: OA-PG-P2
    points: [g5-oa-patterns-graph]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "Rule A 'add 4' from 0 gives 0,4,8,12. Rule B 'add 8' from 0 gives 0,8,16,24. Each B term is the ___ of the matching A term."
    options: {A: "half", B: "double", C: "triple", D: "same"}
    answer: "B"
  # --- g5-nbt-place-value ---
  - id: NBT-PV-1
    role: diagnostic
    points: [g5-nbt-place-value]
    difficulty: 1
    type: mcq
    prompt: "In 4,400 the left 4 is worth how many times the right 4?"
    options: {A: "10", B: "100", C: "1000", D: "2"}
    answer: "A"
  - id: NBT-PV-2
    role: diagnostic
    points: [g5-nbt-place-value]
    difficulty: 2
    type: mcq
    prompt: "The 7 in 7,000 is how many times the 7 in 700?"
    options: {A: "10", B: "100", C: "1/10", D: "1000"}
    answer: "A"
  # --- g5-nbt-place-value (practice) ---
  - id: NBT-PV-P1
    points: [g5-nbt-place-value]
    difficulty: 1
    type: mcq
    role: practice
    prompt: "In 8,800 the left 8 is worth how many times the right 8?"
    options: {A: "10", B: "100", C: "2", D: "1000"}
    answer: "A"
  - id: NBT-PV-P2
    points: [g5-nbt-place-value]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "The 3 in 3,000 is how many times the 3 in 30?"
    options: {A: "100", B: "10", C: "1000", D: "1/10"}
    answer: "A"
  # --- g5-nbt-powers-of-ten ---
  - id: NBT-PT-1
    role: diagnostic
    points: [g5-nbt-powers-of-ten]
    difficulty: 1
    type: numeric
    prompt: "How many zeros are in the product 6 x 1000?"
    answer: "3"
  - id: NBT-PT-2
    role: diagnostic
    points: [g5-nbt-powers-of-ten]
    difficulty: 2
    type: mcq
    prompt: "What is 10 to the power 3 (10^3)?"
    options: {A: "1000", B: "30", C: "100", D: "300"}
    answer: "A"
  - id: NBT-PT-3
    role: diagnostic
    points: [g5-nbt-powers-of-ten]
    difficulty: 2
    type: numeric
    prompt: "3.5 x 100 = ?"
    answer: "350"
  # --- g5-nbt-powers-of-ten (practice) ---
  - id: NBT-PT-P1
    points: [g5-nbt-powers-of-ten]
    difficulty: 1
    type: numeric
    role: practice
    prompt: "What is 10 to the power 4 (10^4)?"
    answer: "10000"
  - id: NBT-PT-P2
    points: [g5-nbt-powers-of-ten]
    difficulty: 2
    type: mcq
    role: practice
    prompt: "2.4 x 1000 = ?"
    options: {A: "2400", B: "240", C: "24000", D: "2.4"}
    answer: "A"
  # --- g5-nbt-round-decimals ---
  - id: NBT-RD-1
    role: diagnostic
    points: [g5-nbt-round-decimals]
    difficulty: 1
    type: numeric
    prompt: "Round 2.7 to the nearest whole number."
    answer: "3"
  - id: NBT-RD-2
    role: diagnostic
    points: [g5-nbt-round-decimals]
    difficulty: 2
    type: numeric
    prompt: "Round 4.56 to the nearest tenth."
    answer: "4.6"
  # --- g5-nbt-round-decimals (practice) ---
  - id: NBT-RD-P1
    points: [g5-nbt-round-decimals]
    difficulty: 1
    type: numeric
    role: practice
