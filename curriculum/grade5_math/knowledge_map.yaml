points:
  - id: g5-equiv-fractions
    strand: Number & Operations—Fractions
    title: Equivalent fractions
    description: Recognize and generate equivalent fractions by scaling numerator and denominator.
    prerequisites: []
    standard_refs: [CCSS.4.NF.A.1]
  - id: g5-add-like
    strand: Number & Operations—Fractions
    title: Add and subtract fractions with like denominators
    description: Add and subtract fractions that already share a denominator.
    prerequisites: []
    standard_refs: [CCSS.5.NF.A.1]
  - id: g5-add-unlike
    strand: Number & Operations—Fractions
    title: Add and subtract fractions with unlike denominators
    description: Find a common denominator, then add or subtract.
    prerequisites: [g5-equiv-fractions, g5-add-like]
    standard_refs: [CCSS.5.NF.A.1, CCSS.5.NF.A.2]
  - id: g5-mult-fraction-whole
    strand: Number & Operations—Fractions
    title: Multiply a fraction by a whole number
    description: Compute a whole number times a fraction as repeated addition / scaling.
    prerequisites: [g5-add-like]
    standard_refs: [CCSS.5.NF.B.4]
  - id: g5-mult-fraction-fraction
    strand: Number & Operations—Fractions
    title: Multiply a fraction by a fraction
    description: Multiply numerators and denominators; interpret as a part of a part.
    prerequisites: [g5-mult-fraction-whole]
    standard_refs: [CCSS.5.NF.B.4]
  - id: g5-divide-unit-fraction
    strand: Number & Operations—Fractions
    title: Divide with unit fractions
    description: Divide a unit fraction by a whole number and a whole number by a unit fraction.
    prerequisites: [g5-mult-fraction-fraction]
    standard_refs: [CCSS.5.NF.B.7]
  - id: g5-decimal-place-value
    strand: Number & Operations in Base Ten
    title: Decimal place value to thousandths
    description: Read, write, and compare decimals to the thousandths place.
    prerequisites: []
    standard_refs: [CCSS.5.NBT.A.3]
  - id: g5-add-subtract-decimals
    strand: Number & Operations in Base Ten
    title: Add and subtract decimals
    description: Align place values to add and subtract decimals to hundredths.
    prerequisites: [g5-decimal-place-value]
    standard_refs: [CCSS.5.NBT.B.7]
  - id: g5-coordinate-system
    strand: Geometry
    title: Coordinate system
    description: Understand axes, the origin, and how an ordered pair locates a point.
    prerequisites: []
    standard_refs: [CCSS.5.G.A.1]
  - id: g5-graph-points
    strand: Geometry
    title: Graph points in the first quadrant
    description: Plot and interpret points given as ordered pairs in the first quadrant.
    prerequisites: [g5-coordinate-system]
    standard_refs: [CCSS.5.G.A.2]
  - id: g5-figure-hierarchy
    strand: Geometry
    title: Hierarchy of two-dimensional figures
    description: Attributes of a category of 2-D figures belong to all its subcategories.
    prerequisites: []
    standard_refs: [CCSS.5.G.B.3]
  - id: g5-classify-figures
    strand: Geometry
    title: Classify two-dimensional figures
    description: Classify 2-D figures in a hierarchy based on their properties.
    prerequisites: [g5-figure-hierarchy]
    standard_refs: [CCSS.5.G.B.4]
  - id: g5-oa-eval-expressions
    strand: Operations & Algebraic Thinking
    title: Evaluate numerical expressions
    description: Use parentheses, brackets, or braces and evaluate expressions with them.
    prerequisites: []
    standard_refs: [CCSS.5.OA.A.1]
  - id: g5-oa-write-expressions
    strand: Operations & Algebraic Thinking
    title: Write and interpret expressions
    description: Write simple expressions and interpret them without evaluating.
    prerequisites: [g5-oa-eval-expressions]
    standard_refs: [CCSS.5.OA.A.2]
  - id: g5-oa-patterns-graph
    strand: Operations & Algebraic Thinking
    title: Generate and graph patterns
    description: Generate two numerical patterns from rules and graph the ordered pairs.
    prerequisites: [g5-coordinate-system]
    standard_refs: [CCSS.5.OA.B.3]
