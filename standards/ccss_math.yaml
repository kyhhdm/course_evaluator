standards:
  # --- Grade 4 prerequisite referenced by Grade 5 ---
  CCSS.4.NF.A.1:
    framework: CCSS-Math
    grade: 4
    domain: Number & Operations—Fractions
    description: "Explain why a/b equals (n*a)/(n*b); recognize and generate equivalent fractions."
  # --- 5.OA Operations & Algebraic Thinking ---
  CCSS.5.OA.A.1:
    framework: CCSS-Math
    grade: 5
    domain: Operations & Algebraic Thinking
    description: "Use parentheses, brackets, or braces in numerical expressions and evaluate them."
  CCSS.5.OA.A.2:
    framework: CCSS-Math
    grade: 5
    domain: Operations & Algebraic Thinking
    description: "Write and interpret simple numerical expressions without evaluating them."
  CCSS.5.OA.B.3:
    framework: CCSS-Math
    grade: 5
    domain: Operations & Algebraic Thinking
    description: "Generate two numerical patterns from two rules and graph the ordered pairs."
  # --- 5.NBT Number & Operations in Base Ten ---
  CCSS.5.NBT.A.1:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "A digit represents 10x the place to its right and 1/10 the place to its left."
  CCSS.5.NBT.A.2:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "Explain patterns when multiplying/dividing by powers of 10; use exponents for 10."
  CCSS.5.NBT.A.3:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "Read, write, and compare decimals to thousandths."
  CCSS.5.NBT.A.4:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "Use place value understanding to round decimals to any place."
  CCSS.5.NBT.B.5:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "Fluently multiply multi-digit whole numbers using the standard algorithm."
  CCSS.5.NBT.B.6:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "Find whole-number quotients with up to four-digit dividends and two-digit divisors."
  CCSS.5.NBT.B.7:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations in Base Ten
    description: "Add, subtract, multiply, and divide decimals to hundredths."
  # --- 5.NF Number & Operations—Fractions ---
  CCSS.5.NF.A.1:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Add and subtract fractions with unlike denominators, including mixed numbers."
  CCSS.5.NF.A.2:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Solve word problems adding and subtracting fractions referring to the same whole."
  CCSS.5.NF.B.3:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Interpret a fraction as division of the numerator by the denominator (a/b = a / b)."
  CCSS.5.NF.B.4:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Multiply a fraction or whole number by a fraction."
  CCSS.5.NF.B.5:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Interpret multiplication as scaling (resizing)."
  CCSS.5.NF.B.6:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Solve real-world problems involving multiplication of fractions and mixed numbers."
  CCSS.5.NF.B.7:
    framework: CCSS-Math
    grade: 5
    domain: Number & Operations—Fractions
    description: "Divide unit fractions by whole numbers and whole numbers by unit fractions."
  # --- 5.MD Measurement & Data ---
  CCSS.5.MD.A.1:
    framework: CCSS-Math
    grade: 5
    domain: Measurement & Data
    description: "Convert among different-sized standard measurement units within a system."
  CCSS.5.MD.B.2:
    framework: CCSS-Math
    grade: 5
    domain: Measurement & Data
    description: "Make a line plot to display a data set of measurements in fractions of a unit."
  CCSS.5.MD.C.3:
    framework: CCSS-Math
    grade: 5
    domain: Measurement & Data
    description: "Recognize volume as an attribute of solid figures and understand volume measurement."
  CCSS.5.MD.C.4:
    framework: CCSS-Math
    grade: 5
    domain: Measurement & Data
    description: "Measure volumes by counting unit cubes."
  CCSS.5.MD.C.5:
    framework: CCSS-Math
    grade: 5
    domain: Measurement & Data
    description: "Relate volume to multiplication and addition; solve real-world volume problems."
  # --- 5.G Geometry ---
  CCSS.5.G.A.1:
    framework: CCSS-Math
    grade: 5
    domain: Geometry
    description: "Define a coordinate system with perpendicular axes meeting at the origin; understand how an ordered pair locates a point."
  CCSS.5.G.A.2:
    framework: CCSS-Math
    grade: 5
    domain: Geometry
    description: "Represent real-world problems by graphing points in the first quadrant."
  CCSS.5.G.B.3:
    framework: CCSS-Math
    grade: 5
    domain: Geometry
    description: "Attributes of a category of two-dimensional figures belong to all subcategories."
  CCSS.5.G.B.4:
    framework: CCSS-Math
    grade: 5
    domain: Geometry
    description: "Classify two-dimensional figures in a hierarchy based on properties."
  # --- High School: Number & Quantity ---
  CCSS.HSN.Q.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Number & Quantity
    description: "Use units to guide the solution of problems; choose and interpret scale and the origin in graphs and data displays."
  CCSS.HSN.RN.A.2:
    framework: CCSS-Math
    grade: HS
    domain: Number & Quantity
    description: "Rewrite expressions involving radicals and rational exponents using the properties of exponents."
  CCSS.HSN.CN.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Number & Quantity
    description: "Know there is a complex number i with i^2 = -1, and that every complex number has the form a + bi."
  CCSS.HSN.CN.C.7:
    framework: CCSS-Math
    grade: HS
    domain: Number & Quantity
    description: "Solve quadratic equations with real coefficients that have complex solutions."
  # --- High School: Algebra ---
  CCSS.HSA.SSE.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Interpret expressions that represent a quantity in terms of its context (terms, factors, and coefficients)."
  CCSS.HSA.SSE.B.3:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Choose and produce an equivalent form of an expression to reveal properties (factoring, completing the square)."
  CCSS.HSA.APR.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Add, subtract, and multiply polynomials; understand that polynomials form a closed system under these operations."
  CCSS.HSA.CED.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Create equations and inequalities in one variable and use them to solve problems."
  CCSS.HSA.REI.B.3:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Solve linear equations and inequalities in one variable."
  CCSS.HSA.REI.B.4:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Solve quadratic equations by inspection, completing the square, the quadratic formula, and factoring."
  CCSS.HSA.REI.C.6:
    framework: CCSS-Math
    grade: HS
    domain: Algebra
    description: "Solve systems of linear equations exactly and approximately, focusing on pairs in two variables."
  # --- High School: Functions ---
  CCSS.HSF.IF.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Functions
    description: "Understand that a function assigns to each input exactly one output; use function notation."
  CCSS.HSF.IF.B.4:
    framework: CCSS-Math
    grade: HS
    domain: Functions
    description: "For a function that models a relationship, interpret key features of graphs and tables (intercepts, intervals, extrema)."
  CCSS.HSF.BF.B.3:
    framework: CCSS-Math
    grade: HS
    domain: Functions
    description: "Identify the effect on the graph of replacing f(x) by f(x)+k, k*f(x), f(kx), and f(x+k)."
  CCSS.HSF.LE.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Functions
    description: "Distinguish between situations that can be modeled with linear functions and with exponential functions."
  CCSS.HSF.LE.A.2:
    framework: CCSS-Math
    grade: HS
    domain: Functions
    description: "Construct linear and exponential functions given a graph, a table, or a description of a relationship."
  # --- High School: Geometry ---
  CCSS.HSG.CO.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Geometry
    description: "Know precise definitions of angle, circle, perpendicular line, parallel line, and line segment."
  CCSS.HSG.CO.C.10:
    framework: CCSS-Math
    grade: HS
    domain: Geometry
    description: "Prove theorems about triangles (e.g., angle sum, base angles of isosceles triangles, midsegment)."
  CCSS.HSG.SRT.A.2:
    framework: CCSS-Math
    grade: HS
    domain: Geometry
    description: "Use similarity transformations to decide whether triangles are similar; explain the AA similarity criterion."
  CCSS.HSG.SRT.C.8:
    framework: CCSS-Math
    grade: HS
    domain: Geometry
    description: "Use trigonometric ratios and the Pythagorean Theorem to solve right triangles in applied problems."
  CCSS.HSG.C.A.2:
    framework: CCSS-Math
    grade: HS
    domain: Geometry
    description: "Identify and describe relationships among inscribed angles, radii, and chords of a circle."
  CCSS.HSG.GMD.A.3:
    framework: CCSS-Math
    grade: HS
    domain: Geometry
    description: "Use volume formulas for cylinders, pyramids, cones, and spheres to solve problems."
  # --- High School: Statistics & Probability ---
  CCSS.HSS.ID.A.1:
    framework: CCSS-Math
    grade: HS
    domain: Statistics & Probability
    description: "Represent data with plots on the real number line (dot plots, histograms, and box plots)."
  CCSS.HSS.ID.B.6:
    framework: CCSS-Math
    grade: HS
    domain: Statistics & Probability
    description: "Represent data on two quantitative variables on a scatter plot and fit a function to the data."
  CCSS.HSS.ID.C.7:
    framework: CCSS-Math
    grade: HS
    domain: Statistics & Probability
    description: "Interpret the slope and the intercept of a linear model in the context of the data."
